# tmux settings for Pi and other modern TUIs.
#
# Pi relies on extended key reporting so modified Enter and similar keys
# survive the trip through tmux.
set -g extended-keys on
set -g extended-keys-format csi-u

# Let tmux handle wheel/trackpad scrolling and keep enough scrollback to make
# that useful inside Ghostty and other modern terminals.
set -g mouse on
set -g history-limit 100000

# Best tmux approximation of pane spacing: subtle borders + pane titles.
# The status panel names its pane "Status", so this gives it a clean label.
set -g pane-border-status top
set -g pane-border-format '     #{pane_title}     '
set -g pane-border-lines double
set -g pane-border-style 'fg=#3b4252'
set -g pane-active-border-style 'fg=#3b4252'
# Older tmux builds (for example some Vibetunnel environments) may not know
# these pane-status style options yet, so set them quietly.
set -gq pane-status-style 'bg=#2e3440,fg=#a7b1c2'
set -gq pane-status-current-style 'bg=#2e3440,fg=#a7b1c2'

# Hide tmux's default bottom status bar; the pane title bars are more useful
# here, and this removes the remaining default-ish chrome.
set -g status off

# Keep auxiliary tmux UI surfaces on a neutral gray palette.
set -g status-style 'bg=#2e3440,fg=#d8dee9'
set -g status-left-style 'bg=#3b4252,fg=#eceff4'
set -g status-right-style 'bg=#3b4252,fg=#eceff4'
set -g window-status-style 'bg=#2e3440,fg=#a7b1c2'
set -g window-status-current-style 'bg=#4c566a,fg=#eceff4,bold'
set -g message-style 'bg=#4c566a,fg=#eceff4'
set -g mode-style 'bg=#4c566a,fg=#eceff4'

# Local machine-specific overrides.
if-shell '[ -f ~/.tmux.conf.local ]' 'source-file ~/.tmux.conf.local'
